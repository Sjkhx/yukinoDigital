<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪乃 · 记忆知识库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pink: #f77fa8;
    --pink-dark: #e2608f;
    --accent: #7b6cf6;
    --text: #3a3345;
    --text-light: #8a8198;
    --panel-bg: #fffdfe;
    --border: #f0e6ec;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #fdeef5 0%, #f9e3ef 45%, #f3d7e9 100%);
    min-height: 100vh;
    color: var(--text);
    padding: 24px 16px;
  }
  .container { max-width: 860px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  header h1 { font-size: 22px; color: var(--pink-dark); }
  header .sub { font-size: 12.5px; color: var(--text-light); margin-top: 4px; }
  .back {
    text-decoration: none;
    font-size: 13px;
    color: var(--text-light);
    padding: 6px 14px;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    background: rgba(255,253,254,.85);
    transition: border-color .15s;
  }
  .back:hover { border-color: var(--pink); color: var(--text); }

  .card {
    background: var(--panel-bg);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(180,140,165,.18);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 15px;
    color: var(--pink-dark);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-size: 11px;
    color: var(--text-light);
    background: #fbf3f7;
    border-radius: 999px;
    padding: 2px 10px;
    font-weight: normal;
  }

  /* 核心资料 */
  #core-text {
    width: 100%;
    min-height: 150px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.8;
    font-family: inherit;
    color: var(--text);
    resize: vertical;
    outline: none;
    background: #fff;
  }
  #core-text:focus { border-color: var(--pink); }

  /* 摘要卡片 */
  .summary {
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    transition: border-color .15s;
  }
  .summary:hover { border-color: #f3c8da; }
  .summary .time { font-size: 11px; color: var(--text-light); margin-bottom: 6px; }
  .summary .text {
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .summary textarea {
    width: 100%;
    min-height: 70px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.7;
    resize: vertical;
    outline: none;
  }
  .summary textarea:focus { border-color: var(--pink); }
  .summary .actions {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    align-items: center;
  }
  .actions .msg { font-size: 12px; color: var(--live, #2fa95f); margin-right: auto; }
  .actions .msg.err { color: #e05252; }

  button {
    border: none;
    border-radius: 10px;
    padding: 7px 16px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: transform .12s, opacity .2s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  .btn-pink { background: linear-gradient(135deg, #ff9dbe, var(--pink)); color: #fff; }
  .btn-purple { background: linear-gradient(135deg, #8f82f9, var(--accent)); color: #fff; }
  .btn-ghost { background: #f4eef3; color: var(--text); }
  .btn-danger { background: #fde8ec; color: #d6455f; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .empty { text-align: center; color: var(--text-light); font-size: 13px; padding: 20px 0; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    background: rgba(58,51,69,.9);
    color: #fff;
    padding: 9px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>🪄 雪乃 · 记忆知识库</h1>
      <div class="sub">核心资料（精确）· 对话摘要（向量检索）· 修改后下次对话自动生效</div>
    </div>
    <a class="back" href="/">← 返回对话</a>
  </header>

  <!-- 核心资料 -->
  <section class="card">
    <h2>📋 核心资料 <span class="badge" id="core-badge">用户持久关键信息</span></h2>
    <textarea id="core-text" placeholder="加载中…"></textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:10px;gap:8px;align-items:center">
      <span class="actions"><span class="msg" id="core-msg"></span></span>
      <button class="btn-pink" id="core-save">💾 保存核心资料</button>
    </div>
  </section>

  <!-- 对话摘要 -->
  <section class="card">
    <h2>💬 对话摘要 <span class="badge" id="sum-badge">共 0 条 · 向量库检索</span></h2>
    <div id="summary-list"></div>
    <div class="empty" id="sum-empty" style="display:none">还没有摘要——和雪乃聊几句就会自动生成</div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

function fmtTime(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function load() {
  try {
    const res = await fetch("/api/memory");
    const data = await res.json();
    if (!data.enabled) {
      $("core-text").value = "记忆未启用（orchestrator 日志查看原因）";
      return;
    }
    $("core-text").value = data.core || "# 用户核心资料\n（暂无资料）";
    const list = $("summary-list");
    list.innerHTML = "";
    $("sum-badge").textContent = `共 ${data.summary_count} 条 · 向量库检索`;
    $("sum-empty").style.display = data.summaries.length ? "none" : "";
    for (const s of data.summaries) {
      list.appendChild(makeSummaryCard(s));
    }
  } catch (e) {
    toast("⚠ 加载失败: " + e.message);
  }
}

function makeSummaryCard(s) {
  const div = document.createElement("div");
  div.className = "summary";

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = fmtTime(s.time) || "时间未知";

  const text = document.createElement("div");
  text.className = "text";
  text.textContent = s.summary;

  const ta = document.createElement("textarea");
  ta.style.display = "none";
  ta.value = s.summary;

  const actions = document.createElement("div");
  actions.className = "actions";
  const msg = document.createElement("span");
  msg.className = "msg";
  const btnEdit = document.createElement("button");
  btnEdit.className = "btn-ghost";
  const btnSave = document.createElement("button");
  btnSave.className = "btn-purple";
  btnSave.style.display = "none";
  const btnDel = document.createElement("button");
  btnDel.className = "btn-danger";

  function setMode(edit) {
    text.style.display = edit ? "none" : "";
    ta.style.display = edit ? "" : "none";
    btnEdit.style.display = edit ? "none" : "";
    btnSave.style.display = edit ? "" : "none";
    btnDel.textContent = edit ? "取消" : "🗑 删除";
  }
  btnEdit.textContent = "✏️ 编辑";
  setMode(false);  // 初始状态：显示文本 + 编辑/删除按钮
  btnEdit.onclick = () => { setMode(true); ta.focus(); };
  btnSave.textContent = "💾 保存";
  btnSave.onclick = async () => {
    const val = ta.value.trim();
    if (!val) { msg.textContent = "内容不能为空"; msg.className = "msg err"; return; }
    btnSave.disabled = true;
    try {
      const res = await fetch(`/api/memory/summary/${s.id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ summary: val }),
      });
      const r = await res.json();
      if (r.ok) {
        text.textContent = val;
        setMode(false);
        msg.textContent = "✓ 已保存（重新向量化）";
        msg.className = "msg";
        toast("摘要已更新");
      } else {
        msg.textContent = r.error || "保存失败";
        msg.className = "msg err";
      }
    } catch (e) {
      msg.textContent = "⚠ " + e.message;
      msg.className = "msg err";
    }
    btnSave.disabled = false;
  };
  btnDel.onclick = async () => {
    if (btnDel.textContent === "取消") { setMode(false); return; }
    if (!confirm("确定删除这条摘要？")) return;
    try {
      const res = await fetch(`/api/memory/summary/${s.id}`, { method: "DELETE" });
      const r = await res.json();
      if (r.ok) {
        div.remove();
        toast("摘要已删除");
        load();
      } else {
        toast("删除失败");
      }
    } catch (e) {
      toast("⚠ " + e.message);
    }
  };

  actions.append(msg, btnEdit, btnSave, btnDel);
  div.append(time, text, ta, actions);
  return div;
}

$("core-save").onclick = async () => {
  const val = $("core-text").value;
  const msg = $("core-msg");
  const btn = $("core-save");
  btn.disabled = true;
  try {
    const res = await fetch("/api/memory/core", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ core: val }),
    });
    const r = await res.json();
    if (r.ok) {
      msg.textContent = "✓ 已保存，下次对话生效";
      msg.className = "msg";
      toast("核心资料已保存");
    } else {
      msg.textContent = r.error || "保存失败";
      msg.className = "msg err";
    }
  } catch (e) {
    msg.textContent = "⚠ " + e.message;
    msg.className = "msg err";
  }
  btn.disabled = false;
};

load();
</script>
</body>
</html>
